name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-test:
    name: Unit tests 
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select the node version
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run unit

  
